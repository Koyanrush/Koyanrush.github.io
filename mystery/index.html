    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 12% 14%, rgba(131,185,255,0.18), transparent 24%), linear-gradient(135deg, #071225, #102247);
      color: #edf2ff;
      font-family: Bahnschrift, "Microsoft YaHei UI", sans-serif;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(255,255,255,0.05), transparent 46%);
      opacity: 0.42;
    }
    .card {
      display: flex;
      flex-direction: column;
      width: min(680px, calc(100vw - 28px));
      padding: 22px;
      border-radius: 28px;
      border: 1px solid rgba(139,169,241,0.22);
      background: rgba(9,18,40,0.9);
      box-shadow: 0 30px 80px rgba(2,8,24,0.55);
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
      transition: box-shadow .18s ease, border-color .18s ease;
      will-change: transform;
      overflow: hidden;
      isolation: isolate;
      z-index: 1;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      background:
        radial-gradient(circle at var(--glow-x, 50%) var(--glow-y, 50%), rgba(131,185,255,0.24), transparent 18%),
        linear-gradient(120deg, rgba(255,255,255,0.08), transparent 18%, transparent 82%, rgba(255,255,255,0.08));
      opacity: var(--glow-opacity, 0.82);
      pointer-events: none;
      z-index: 0;
    }
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 24%, rgba(255,255,255,0.10) 38%, transparent 50%);
      transform: translateX(-120%);
      animation: card-sweep 7s linear infinite;
      pointer-events: none;
      opacity: .52;
      z-index: 0;
    }
    .card > * {
      position: relative;
      z-index: 1;
    }
    @keyframes card-sweep {
      0% { transform: translateX(-120%); }
      50%, 100% { transform: translateX(120%); }
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .pill, .button, .badge {
      border-radius: 999px;
    }
    .pill, .button {
      border: 1px solid rgba(131,185,255,0.25);
      background: rgba(131,185,255,0.12);
      color: #edf2ff;
    }
    .pill {
      padding: 8px 16px;
      color: #dfe8ff;
      font-weight: 700;
      background: rgba(86,110,208,0.26);
      border-color: rgba(119,147,255,0.30);
    }
    .button {
      padding: 10px 16px;
      cursor: pointer;
    }
    .copy {
      text-align: left;
      margin: 18px 0 10px;
      max-width: 100%;
      transition: margin .22s ease;
    }
    h1 {
      margin: 0;
      color: #ff9ab3;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
    }
    .lead {
      margin: 14px 0 0;
      color: #aab8d6;
      line-height: 1.72;
      font-size: 14px;
      transition: margin .22s ease, line-height .22s ease;
    }
    .panel {
      display: none;
      padding: 0;
      border: none;
      background: none;
    }
    .panel.active {
      display: block;
      animation: panel-enter .34s cubic-bezier(.2,.72,.16,1);
      transform-origin: 50% 24%;
    }
    @keyframes panel-enter {
      0% { opacity: 0; transform: translateY(10px) scale(0.988); filter: blur(4px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    .slot {
      margin-top: 16px;
      min-height: 108px;
      padding: 16px;
      border-radius: 16px;
      border: 1px dashed rgba(153,186,255,0.22);
      background: rgba(4,9,21,0.42);
      display: grid;
      place-items: center;
    }
    .widget-shell {
      width: 100%;
      display: grid;
      gap: 14px;
      justify-items: center;
    }
    .widget-meta {
      width: 100%;
      color: #8fa7d9;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .widget-target {
      width: 100%;
      display: grid;
      place-items: center;
      min-height: 74px;
    }
    .placeholder {
      width: 100%;
      text-align: center;
      color: #c9d8ff;
      line-height: 1.7;
    }
    #panel-6 { padding-top: 0; }

      margin-top: 18px;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid rgba(151,189,255,0.18);
      background: #020916;
    }
    .badge {

      right: 14px;
      padding: 8px 12px;
      background: rgba(53,105,255,0.85);
      color: #edf3ff;
      font-weight: 700;
    }
    video {

    .error {

      background: rgba(8,18,38,0.58);

    .pill.centered {

      position: relative;

    }
    .topbar.centered #theme {

      right: 0;
      top: 50%;

    }
    .error[data-tone=warning] {

      border-color: rgba(255,191,104,0.24);
      background: rgba(55,31,8,0.34);
    }
    .error[data-tone=info] {

      background: rgba(8,18,38,0.58);
    }

      function sdkReadyFor(index) {
        if (index < 2) return !!(window.turnstile && typeof window.turnstile.render === 'function');
        return !!(window.grecaptcha && typeof window.grecaptcha.render === 'function');
      }

      function clearSdkWatch() {
        if (!sdkWatchId) return;
        window.clearInterval(sdkWatchId);
        sdkWatchId = 0;
      }

      function watchSdk(index) {
        clearSdkWatch();
        sdkWatchId = window.setInterval(() => {
          if (state.index !== index || state.mode !== 'real') {
            clearSdkWatch();
            return;
          }
          if (!sdkReadyFor(index)) return;
          clearSdkWatch();
          renderSlot(index);
        }, 250);
      }

      function mountTurnstile(index, slot) {
        if (!config.turnstileSiteKey) {
          slot.innerHTML = '<div class="placeholder"><p>' + escapeHtml(providerCopy.missingTurnstile) + '</p></div>';
          showStatus(providerCopy.missingTurnstile, 'warning');
          return;
        }
        slot.innerHTML = makeWidgetFrame('turnstile', index);
        const target = document.getElementById('widget-' + (index + 1));
        if (!(window.turnstile && typeof window.turnstile.render === 'function')) {
          showStatus(providerCopy.waitingSdk, 'warning');
          watchSdk(index);
          return;
        }
        const widgetId = window.turnstile.render(target, {
          sitekey: config.turnstileSiteKey,
          theme: document.body.dataset.theme === 'alt' ? 'dark' : 'auto',
          callback: () => {
            if (state.index !== index) return;
            showStatus(providerCopy.completed, 'info');
            window.setTimeout(() => { if (state.index === index) completeStage(index); }, 420);
          },
          'expired-callback': () => {
            if (state.index !== index) return;
            showStatus(providerCopy.turnstileReady, 'warning');
          },
          'error-callback': () => {
            if (state.index !== index) return;
            showStatus('\u672c\u8f6e Turnstile \u52a0\u8f7d\u5931\u8d25\uff0c\u8bf7\u5237\u65b0\u6216\u7a0d\u540e\u91cd\u8bd5\u3002', 'warning');
          }
        });
        widgetState.turnstile.ids[index] = widgetId;
        showStatus(providerCopy.turnstileReady, 'info');
      }

      function mountRecaptcha(index, slot) {
        if (!config.recaptchaSiteKey) {
          slot.innerHTML = '<div class="placeholder"><p>' + escapeHtml(providerCopy.missingRecaptcha) + '</p></div>';
          showStatus(providerCopy.missingRecaptcha, 'warning');
          return;
        }
        slot.innerHTML = makeWidgetFrame('recaptcha', index);
        const target = document.getElementById('widget-' + (index + 1));
        if (!(window.grecaptcha && typeof window.grecaptcha.render === 'function')) {
          showStatus(providerCopy.waitingSdk, 'warning');
          watchSdk(index);
          return;
        }
        const widgetId = window.grecaptcha.render(target, {
          sitekey: config.recaptchaSiteKey,
          theme: document.body.dataset.theme === 'alt' ? 'dark' : 'light',
          callback: () => {
            if (state.index !== index) return;
            showStatus(providerCopy.completed, 'info');
            window.setTimeout(() => {
              if (state.index !== index) return;
              if (index === 4) {
                renderStage(5);
                return;
              }
              completeStage(index);
            }, 420);
          },
          'expired-callback': () => {
            if (state.index !== index) return;
            showStatus(providerCopy.recaptchaReady, 'warning');
          },
          'error-callback': () => {
            if (state.index !== index) return;
            showStatus('\u672c\u8f6e reCAPTCHA \u52a0\u8f7d\u5931\u8d25\uff0c\u8bf7\u5237\u65b0\u6216\u7a0d\u540e\u91cd\u8bd5\u3002', 'warning');
          }
        });
        widgetState.recaptcha.ids[index - 2] = widgetId;
        showStatus(providerCopy.recaptchaReady, 'info');
      }

      function renderSlot(index) {
        const slot = slots[index];
        if (!slot) return;
        clearSdkWatch();
        if (state.mode === 'demo') {
          slot.innerHTML = '<div class="placeholder"><p>Demo mode active. No live widget is loaded.</p></div>';
          return;
        }
        if (index < 2) {
          mountTurnstile(index, slot);
          return;
        }
        mountRecaptcha(index, slot);
      }

      function renderStage(index) {
        state.index = index;
        const stage = stages[index];
        panels.forEach((panel, i) => panel.classList.toggle('active', i === index));
        pill.textContent = stage.pill;
        headline.textContent = stage.title;
        if (index === 5) {
          lead.innerHTML = [
            '\u606d\u559c\u4f60\u5b8c\u6210\u4e86\u4e94\u8f6e\u9a8c\u8bc1\uff0c\u4f46\u8fd9\u91cc\u4ece\u6765\u6ca1\u6709\u771f\u6b63\u7684\u5165\u53e3\u3002',
            '\u4f60\u521a\u521a\u70b9\u8fc7\u7684\u6bcf\u4e00\u4e2a\u9a8c\u8bc1\uff0c\u90fd\u53ea\u662f\u6d41\u7a0b\u6f14\u51fa\u7684\u4e00\u90e8\u5206\u3002'
          ].map((line) => '<span class="lead-line">' + escapeHtml(line) + '</span>').join('');
        } else {
          lead.textContent = stage.lead;
        }
        topbar.classList.toggle('centered', index === 5);
        pill.classList.toggle('centered', index === 5);
        document.body.toggleAttribute('data-final', index === 5);

        if (index < 5) {
          renderSlot(index);
        } else {
          clearSdkWatch();
        }

        if (index === 5 && video) {
          video.muted = true;
          video.play().catch(() => {});
        }

        showStatus(stage.status, stage.tone);
      }

      function setMode(mode) {
        state.mode = mode;
        renderStage(0);
      }

      function hijackClick(node, handler) {
        if (!node) return;
        node.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();
          handler();
        }, true);
      }

      hijackClick(reset, () => {
        renderStage(0);
        showStatus('\u6240\u6709\u89c6\u89c9\u72b6\u6001\u5df2\u6062\u590d\u5230\u521d\u59cb\u503c\u3002\u5f53\u524d\u4f1a\u8bdd\u8bb0\u5f55\u5df2\u6e05\u7a7a\u3002', 'info');
      });
      hijackClick(theme, () => {
        if (document.body.dataset.theme === 'alt') {
          delete document.body.dataset.theme;
          theme.innerHTML = '\u263e';
        } else {
          document.body.dataset.theme = 'alt';
          theme.innerHTML = '\u2600';
        }
        if (state.index < 5 && state.mode === 'real') {
          renderSlot(state.index);
        }
      });

      if (card && window.matchMedia('(hover: hover) and (pointer: fine) and (min-width: 721px)').matches) {
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;
        let glowX = 50;
        let glowY = 50;
        let glowOpacity = 0;
        let rafId = 0;

        const renderTilt = () => {
          currentX += (targetX - currentX) * 0.16;
          currentY += (targetY - currentY) * 0.16;
          card.style.setProperty('--tilt-x', currentX.toFixed(2) + 'deg');
          card.style.setProperty('--tilt-y', currentY.toFixed(2) + 'deg');
          card.style.setProperty('--glow-x', glowX.toFixed(2) + '%');
          card.style.setProperty('--glow-y', glowY.toFixed(2) + '%');
          card.style.setProperty('--glow-opacity', glowOpacity.toFixed(2));
          if (Math.abs(targetX - currentX) > 0.02 || Math.abs(targetY - currentY) > 0.02) {
            rafId = requestAnimationFrame(renderTilt);
          } else {
            currentX = targetX;
            currentY = targetY;
            rafId = 0;
          }
        };

        const queueRender = () => {
          if (!rafId) rafId = requestAnimationFrame(renderTilt);
        };

        card.addEventListener('pointermove', (event) => {
          const rect = card.getBoundingClientRect();
          const px = (event.clientX - rect.left) / rect.width;
          const py = (event.clientY - rect.top) / rect.height;
          targetY = (0.5 - px) * 16;
          targetX = (py - 0.5) * 12;
          glowX = px * 100;
          glowY = py * 100;
          glowOpacity = 0.82;
          queueRender();
        }, true);

        card.addEventListener('pointerleave', () => {
          targetX = 0;
          targetY = 0;
          glowX = 50;
          glowY = 50;
          glowOpacity = 0;
          queueRender();
        }, true);
      }

      card.style.setProperty('--glow-x', '50%');
      card.style.setProperty('--glow-y', '50%');
      card.style.setProperty('--glow-opacity', '0');
      theme.innerHTML = '\u263e';
      setMode(state.mode);
    })();
  </script>
</body>
</html>
